<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musix — Developer Console</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<style>
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 80px;width:100%}
.dev-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.dev-head .lmark{width:44px;height:44px;border-radius:12px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}
.dev-head h1{font-size:22px;font-weight:800}
.dev-head small{display:block;color:var(--tx3);font-size:11px;letter-spacing:1.6px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--tx2);font-size:13px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);transition:.15s;text-decoration:none;margin-bottom:22px}
.back:hover{color:#fff;border-color:#fff}
.grid-dev{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{font-size:14px;font-weight:800;letter-spacing:1.2px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.panel h2 .ic{width:30px;height:30px;border-radius:9px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--tx3);margin-bottom:6px}
.field input,.field select{
  width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--tx);font-size:13.5px;outline:none;font-family:inherit;
}
.field input:focus,.field select:focus{border-color:#fff}
.field input[type=file]{padding:8px;font-size:12.5px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:700;
  background:#fff;color:#000;transition:.15s;border:none;cursor:pointer;font-family:inherit;
}
.btn:hover{transform:scale(1.03);box-shadow:0 0 26px rgba(255,255,255,.25)}
.btn.ghost{background:transparent;color:var(--tx2);border:1px solid var(--line)}
.btn.ghost:hover{color:#fff;border-color:#fff}
.btn:disabled{opacity:.5;pointer-events:none}
.status{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.7}
.status b{color:#fff}
.status .ok{color:#4ade80}.status .no{color:#f87171}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--tx2);font-size:12px;cursor:pointer;transition:.15s}
.chip:hover{color:#fff;border-color:#fff}
.yt-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.yt-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);transition:.15s}
.yt-item:hover{background:var(--card-h)}
.yt-item .info{flex:1;min-width:0}
.yt-item .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yt-item .m{color:var(--tx3);font-size:11.5px;margin-top:3px}
.yt-item .dur{font-size:11px;color:var(--tx3);white-space:nowrap}
.yt-item .add{background:#fff;color:#000;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;transition:.15s}
.yt-item .add:hover{transform:scale(1.12)}
.hint{color:var(--tx3);font-size:11.5px;line-height:1.7;margin-top:8px}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:200;
  background:#fff;color:#000;font-weight:700;font-size:13px;padding:13px 26px;border-radius:99px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);transition:.3s;opacity:0;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/"><i data-lucide="arrow-left" width="16" height="16"></i>&nbsp;Kembali ke Player</a>
  <div class="dev-head">
    <div class="lmark"><i data-lucide="terminal" width="22" height="22"></i></div>
    <div><h1>DEVELOPER CONSOLE</h1><small>MUSIX — UPLOAD • ARTIS • YOUTUBE</small></div>
  </div>

  <div class="grid-dev">
    <!-- UPLOAD AUDIO -->
    <div class="panel">
      <h2><span class="ic"><i data-lucide="upload" width="16" height="16"></i></span> UPLOAD AUDIO</h2>
      <div class="field"><label>FILE AUDIO (mp3/m4a/webm)</label><input type="file" id="upAudio" accept="audio/*"></div>
      <div class="field"><label>COVER (opsional)</label><input type="file" id="upCover" accept="image/*"></div>
      <div class="field"><label>JUDUL *</label><input id="upTitle" placeholder="Nama lagu / sound"></div>
      <div class="field"><label>ARTIS</label><input id="upArtist" placeholder="Nama kreator"></div>
      <div class="field"><label>KATEGORI</label>
        <select id="upCat">
          <option value="dev">Upload Baru</option>
          <option value="sasak">Lagu Sasak</option>
          <option value="lombok">Lombok / Della</option>
          <option value="kane">Sound Kane</option>
          <option value="rmx">Sound RMX</option>
          <option value="katakata">Kata Kata</option>
          <option value="galau">Kata Kata Galau</option>
          <option value="quotes">Quotes</option>
          <option value="trending">Trending TikTok</option>
          <option value="potre">Sesi Potre</option>
        </select>
      </div>
      <div class="field"><label>BADGE / CAPTION</label><input id="upBadge" placeholder="contoh: Viral 2026"></div>
      <button class="btn" onclick="uploadAudio()"><i data-lucide="upload" width="15" height="15"></i> Upload</button>
      <div class="status" id="upStatus"></div>
    </div>

    <!-- ARTIS -->
    <div class="panel">
      <h2><span class="ic"><i data-lucide="users" width="16" height="16"></i></span> TAMBAH ARTIS</h2>
      <div class="field"><label>NAMA ARTIS</label><input id="artName" placeholder="Nama kreator/artis"></div>
      <button class="btn" onclick="addArtist()"><i data-lucide="user-plus" width="15" height="15"></i> Tambah Artis</button>
      <div class="status" id="artStatus"></div>
      <div class="hint" id="artList"></div>
    </div>

    <!-- YOUTUBE -->
    <div class="panel" style="grid-column:1/-1">
      <h2><span class="ic"><i data-lucide="youtube" width="16" height="16"></i></span> TAMBAH DARI YOUTUBE (yt-dlp)</h2>
      <div class="field"><label>CARI LAGU / SOUND</label>
        <div style="display:flex;gap:10px">
          <input id="ytQ" placeholder="contoh: lagu sasak viral 2026, dj remix terbaru..." style="flex:1" onkeydown="if(event.key==='Enter')ytSearch()">
          <button class="btn ghost" onclick="ytSearch()"><i data-lucide="search" width="15" height="15"></i> Cari</button>
        </div>
      </div>
      <div class="chips" id="popChips"></div>
      <div class="yt-list" id="ytList"></div>
      <div class="hint">Klik ➕ di hasil cari → audio di-download (MP3) → otomatis masuk player kategori <b>YouTube / Populer</b>. Butuh yt-dlp terpasang di server.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const POPULAR = [
  "lagu viral 2026", "lagu sasak viral terbaru", "dj remix viral tiktok", "lagu galau terbaru",
  "lagu lombok kecimol", "sound kane parah", "lagu kata kata bijak", "joget nasi padang",
  "lagu minang terbaru", "koplo viral 2026",
]
document.getElementById("popChips").innerHTML = POPULAR
  .map((p) => '<button class="chip" onclick="setQ(\'' + p.replace(/'/g, "\\'") + '\')">' + p + "</button>")
  .join("")
function setQ(q) { document.getElementById("ytQ").value = q; ytSearch() }

function toast(msg) {
  const t = document.getElementById("toast")
  t.textContent = msg
  t.classList.add("show")
  setTimeout(() => t.classList.remove("show"), 2800)
}

async function api(url, opt) {
  const r = await fetch(url, opt)
  const j = await r.json().catch(() => ({}))
  return { status: r.status, ...j }
}

// ── Upload audio ──
async function uploadAudio() {
  const audio = document.getElementById("upAudio").files[0]
  const title = document.getElementById("upTitle").value.trim()
  if (!audio) return toast("❌ Pilih file audio dulu")
  if (!title) return toast("❌ Judul wajib diisi")
  const fd = new FormData()
  fd.append("audio", audio)
  const cov = document.getElementById("upCover").files[0]
  if (cov) fd.append("cover", cov)
  fd.append("title", title)
  fd.append("artist", document.getElementById("upArtist").value.trim() || "Unknown")
  fd.append("category", document.getElementById("upCat").value)
  fd.append("badge", document.getElementById("upBadge").value.trim())
  document.getElementById("upStatus").innerHTML = "⏳ Uploading..."
  const r = await api("/api/dev/upload", { method: "POST", body: fd })
  if (r.ok) {
    document.getElementById("upStatus").innerHTML = "✅ <b>" + r.entry.judul + "</b> masuk player! (" + r.total + " lagu total)"
    toast("✅ " + r.entry.judul + " berhasil ditambahkan!")
    document.getElementById("upAudio").value = ""
    document.getElementById("upCover").value = ""
    document.getElementById("upTitle").value = ""
  } else {
    document.getElementById("upStatus").innerHTML = "❌ " + (r.error || "Gagal")
    toast("❌ Upload gagal")
  }
}

// ── Artist ──
async function loadArtists() {
  const r = await api("/api/dev/artists")
  if (r.artists) {
    const top = r.artists.slice(0, 12)
    document.getElementById("artList").innerHTML = "Artis terdaftar: <b>" + top.join("</b>, <b>") + "</b>" + (r.artists.length > 12 ? "…" : "")
    refreshIcons()
  }
}
async function addArtist() {
  const name = document.getElementById("artName").value.trim()
  if (!name) return toast("❌ Nama artis wajib")
  const r = await api("/api/dev/artists", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) })
  if (r.ok) {
    toast("✅ Artis " + name + " ditambahkan")
    document.getElementById("artName").value = ""
    document.getElementById("artStatus").innerHTML = "✅ Terdaftar: <b>" + r.artists.length + "</b> artis"
    loadArtists()
  } else toast("❌ " + (r.error || "Gagal"))
}

// ── YouTube ──
async function ytSearch() {
  const q = document.getElementById("ytQ").value.trim()
  if (!q) return toast("❌ Tulis kata kunci dulu")
  const list = document.getElementById("ytList")
  list.innerHTML = '<div class="hint">⏳ Mencari di YouTube...</div>'
  const r = await api("/api/yt/search?q=" + encodeURIComponent(q) + "&n=8")
  if (!r.items || !r.items.length) { list.innerHTML = '<div class="hint">❌ Tidak ada hasil / yt-dlp belum aktif</div>'; return }
  list.innerHTML = r.items.map((it, k) =>
    '<div class="yt-item">' +
    '<span style="width:20px;text-align:center;color:var(--tx3);font-size:12px">' + (k + 1) + "</span>" +
    '<div class="info"><div class="t">' + esc(it.title) + '</div><div class="m">' + esc(it.channel || "") + "</div></div>" +
    '<span class="dur">' + fmt(it.duration) + "</span>" +
    '<button class="add" title="Tambah ke player" onclick="ytAdd(\'' + it.url + '\',\'' + escAttr(it.title) + '\',\'' + escAttr(it.channel || "") + '\',this)"><i data-lucide="plus" width="15" height="15"></i></button>' +
    "</div>"
  ).join("")
  refreshIcons()
}
async function ytAdd(url, title, channel, btn) {
  btn.disabled = true
  btn.innerHTML = '<i data-lucide="loader" width="15" height="15"></i>'
  refreshIcons()
  const r = await api("/api/yt/add", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url, title, artist: channel }) })
  if (r.ok) {
    btn.innerHTML = "✓"
    toast("✅ " + title.slice(0, 40) + " masuk player!")
  } else {
    btn.innerHTML = '<i data-lucide="x" width="15" height="15"></i>'
    refreshIcons()
    toast("❌ " + (r.error || "Gagal download"))
    btn.disabled = false
  }
}

function fmt(sec) {
  sec = parseInt(sec || "0", 10)
  if (!sec) return ""
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0")
}
function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") }
function escAttr(s) { return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;") }
function refreshIcons() { if (window.lucide) { try { lucide.createIcons() } catch (e) {} } }

// status
;(async () => {
  const r = await api("/api/dev/status")
  document.getElementById("upStatus").innerHTML =
    "Server: <b>" + (r.songs || "?") + "</b> lagu • yt-dlp: <b class='" + (r.ytdlp ? "ok" : "no") + "'>" + (r.ytdlp ? "AKTIF" : "TIDAK") + "</b>"
  loadArtists()
})()
</script>
</body>
</html>
